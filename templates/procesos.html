{% extends "base.html" %}

{% block contenido %}
<!-- LIBRERÍAS DEL BUSCADOR INTELIGENTE (Tom Select) -->
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.default.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
<style>
    .ts-control { border-radius: 0.375rem; border-color: #e5e7eb; padding: 0.5rem 0.75rem; }
    .ts-control.focus { border-color: #0d9488; box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.2); }
</style>

<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm">
    <h2 class="text-xl font-semibold text-slate-800">Radicación de Expedientes</h2>
</header>

<div class="p-8 h-[calc(100vh-4rem)] overflow-y-auto">
    <!-- FORMULARIO A PANTALLA COMPLETA -->
    <div class="max-w-5xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
        
        <form method="POST" action="/crear_expediente_completo" class="space-y-6">
            
            <!-- DATOS BÁSICOS -->
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Radicado Rama Judicial *</label>
                    <input type="text" name="radicado_rama" value="EN REPARTO" required class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-teal-500 outline-none uppercase font-mono">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Naturaleza *</label>
                    <select name="naturaleza" required class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-teal-500 outline-none uppercase">
                        <option value="EJECUTIVO SINGULAR">Ejecutivo Singular</option>
                        <option value="EJECUTIVO HIPOTECARIO">Ejecutivo Hipotecario</option>
                        <option value="CIVIL: VERBAL">Civil: Verbal</option>
                    </select>
                </div>
            </div>

            <!-- VINCULACIÓN DE PARTES (CON BUSCADOR) -->
            <div class="bg-blue-50/50 p-5 rounded-lg border border-blue-100">
                <h3 class="font-semibold text-blue-800 mb-4 flex items-center gap-2"><i data-lucide="users" class="w-5 h-5"></i> 1. Vinculación de Partes</h3>
                
                <div class="grid grid-cols-2 gap-6">
                    <!-- DEMANDANTES -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Demandante(s) / Cliente(s)</label>
                        <select id="select-demandantes" name="demandantes_existentes" multiple placeholder="Buscar por nombre o cédula..." autocomplete="off">
                            {% for cliente in contactos_clientes %}
                                <option value="{{ cliente.identificacion }}">{{ cliente.identificacion }} - {{ cliente.nombre }}</option>
                            {% endfor %}
                        </select>
                        
                        <div id="contenedor-nuevos-demandantes" class="space-y-2 mt-3"></div>
                        <button type="button" onclick="agregarFila('demandantes')" class="mt-2 text-sm text-blue-600 font-semibold hover:underline flex items-center gap-1">
                            ➕ Crear nuevo demandante al vuelo
                        </button>
                    </div>

                    <!-- DEMANDADOS -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Demandado(s) / Contraparte(s)</label>
                        <select id="select-demandados" name="demandados_existentes" multiple placeholder="Buscar por nombre o cédula..." autocomplete="off">
                            {% for contraparte in contactos_contrapartes %}
                                <option value="{{ contraparte.identificacion }}">{{ contraparte.identificacion }} - {{ contraparte.nombre }}</option>
                            {% endfor %}
                        </select>
                        
                        <div id="contenedor-nuevos-demandados" class="space-y-2 mt-3"></div>
                        <button type="button" onclick="agregarFila('demandados')" class="mt-2 text-sm text-blue-600 font-semibold hover:underline flex items-center gap-1">
                            ➕ Crear nuevo demandado al vuelo
                        </button>
                    </div>
                </div>
            </div>

            <!-- INMUEBLE -->
            <div class="bg-green-50/50 p-5 rounded-lg border border-green-100">
                <h3 class="font-semibold text-green-800 mb-4">2. Propiedad Involucrada</h3>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Conjunto Residencial</label>
                        <input type="text" name="conjunto" required placeholder="Ej: Mirador de la Villa" class="w-full px-4 py-2 border rounded-md uppercase">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nomenclatura Exacta</label>
                        <input type="text" name="apto" required placeholder="Ej: 25 202" class="w-full px-4 py-2 border rounded-md uppercase">
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-4">
                <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition-colors flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-5 h-5"></i> Radicar Proceso Completo
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Iniciar Buscadores
    new TomSelect("#select-demandantes",{ plugins: ['remove_button'], create: false, sortField: { field: "text", direction: "asc" }});
    new TomSelect("#select-demandados",{ plugins: ['remove_button'], create: false, sortField: { field: "text", direction: "asc" }});

    // Añadir filas al vuelo
    function agregarFila(tipo) {
        const contenedor = document.getElementById(`contenedor-nuevos-${tipo}`);
        const prefijo = tipo === 'demandantes' ? 'nuevo_dem' : 'nuevo_ddo';
        const html = `
            <div class="flex gap-2 items-center bg-white p-2 border rounded shadow-sm">
                <input type="text" name="${prefijo}_id" placeholder="Cédula/NIT" class="w-1/3 px-2 py-1.5 border rounded text-sm outline-none focus:border-teal-500" required>
                <input type="text" name="${prefijo}_nombre" placeholder="Nombre completo" class="w-2/3 px-2 py-1.5 border rounded text-sm uppercase outline-none focus:border-teal-500" required>
                <button type="button" onclick="this.parentElement.remove()" class="text-red-500 font-bold px-3 py-1 hover:bg-red-50 rounded">X</button>
            </div>`;
        contenedor.insertAdjacentHTML('beforeend', html);
    }
</script>
{% endblock %}
