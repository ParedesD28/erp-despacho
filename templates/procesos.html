{% extends "base.html" %}

{% block contenido %}
<!-- LIBRERÍAS DEL BUSCADOR INTELIGENTE -->
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.default.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
<style>
    .ts-control { border-radius: 0.375rem; border-color: #e5e7eb; padding: 0.5rem 0.75rem; }
    .ts-control.focus { border-color: #0d9488; box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.2); }
</style>

<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm">
    <h2 class="text-xl font-semibold text-slate-800">Radicación de Expedientes</h2>
</header>

<div class="p-8 h-[calc(100vh-4rem)] overflow-y-auto">
    <div class="max-w-5xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">
        
        <form method="POST" action="/crear_expediente_completo" class="space-y-6">
            
            <!-- 1. IDENTIFICACIÓN BÁSICA Y JUZGADO -->
            <div class="col-span-2 md:col-span-3 bg-slate-50 p-3 rounded border border-slate-200 mt-2">
    <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Juzgado de Conocimiento</label>
    <div class="grid grid-cols-3 gap-3">
        <!-- 1. Número -->
        <input type="number" name="juzgado_numero" min="1" max="100" placeholder="N° (Ej: 1)" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-teal-500 outline-none bg-white">
        
        <!-- 2. Especialidad -->
        <select name="juzgado_tipo" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-teal-500 outline-none uppercase text-sm bg-white">
            <option value="CIVIL MUNICIPAL">Civil Municipal</option>
            <option value="CIVIL DEL CIRCUITO">Civil del Circuito</option>
            <option value="DE PEQUEÑAS CAUSAS">De Pequeñas Causas</option>
            <option value="PROMISCUO MUNICIPAL">Promiscuo Municipal</option>
        </select>
        
        <!-- 3. Ciudad -->
        <input type="text" name="juzgado_ciudad" value="PEREIRA" required class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-teal-500 outline-none uppercase bg-white">
    </div>
</div>

            <!-- 2. VINCULACIÓN DE PARTES -->
            <div class="bg-blue-50/50 p-5 rounded-lg border border-blue-100">
                <h3 class="font-semibold text-blue-800 mb-4 flex items-center gap-2"><i data-lucide="users" class="w-5 h-5"></i> 2. Vinculación de Partes</h3>
                
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Demandante(s) / Cliente(s)</label>
                        <select id="select-demandantes" name="demandantes_existentes" multiple placeholder="Buscar por nombre o cédula...">
                            {% for cliente in contactos_clientes %}
                                <option value="{{ cliente.identificacion or 'S/N' }}">{{ cliente.identificacion or 'S/N' }} - {{ cliente.nombre }}</option>
                            {% endfor %}
                        </select>
                        <div id="contenedor-nuevos-demandantes" class="space-y-2 mt-3"></div>
                        <button type="button" onclick="agregarFila('demandantes')" class="mt-2 text-sm text-blue-600 font-semibold hover:underline">➕ Crear nuevo demandante al vuelo</button>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Demandado(s) / Contraparte(s)</label>
                        <select id="select-demandados" name="demandados_existentes" multiple placeholder="Buscar por nombre o cédula...">
                            {% for contraparte in contactos_contrapartes %}
                                <option value="{{ contraparte.identificacion or 'S/N' }}">{{ contraparte.identificacion or 'S/N' }} - {{ contraparte.nombre }}</option>
                            {% endfor %}
                        </select>
                        <div id="contenedor-nuevos-demandados" class="space-y-2 mt-3"></div>
                        <button type="button" onclick="agregarFila('demandados')" class="mt-2 text-sm text-blue-600 font-semibold hover:underline">➕ Crear nuevo demandado al vuelo</button>
                    </div>
                </div>
            </div>

            <!-- 3. INMUEBLE -->
            <div class="bg-green-50/50 p-5 rounded-lg border border-green-100">
                <h3 class="font-semibold text-green-800 mb-4 flex items-center gap-2"><i data-lucide="home" class="w-5 h-5"></i> 3. Propiedad Involucrada (Asignada al primer demandado)</h3>
                <div class="grid grid-cols-2 gap-6">
                    <div>
    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Conjunto Residencial</label>
    <select id="select-conjunto" name="conjunto" required placeholder="Seleccione el conjunto..." class="w-full">
        <option value="">Buscar conjunto en la BD...</option>
        {% for cliente in contactos_clientes %}
            <option value="{{ cliente.nombre }}">{{ cliente.nombre }}</option>
        {% endfor %}
    </select>
</div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nomenclatura Exacta</label>
                        <input type="text" name="apto" required placeholder="Ej: 25 202" class="w-full px-4 py-2 border rounded-md uppercase">
                    </div>
                </div>
            </div>

            <!-- 4. FINANZAS Y MEDIDAS -->
            <div class="bg-purple-50/50 p-5 rounded-lg border border-purple-100">
                <h3 class="font-semibold text-purple-800 mb-4 flex items-center gap-2"><i data-lucide="scale" class="w-5 h-5"></i> 4. Pretensiones, Medidas y Asignación</h3>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Pretensiones / Cuantía ($)</label>
                        <input type="number" step="0.01" name="pretensiones" required placeholder="Ej: 1524238.00" class="w-full px-4 py-2 border rounded-md font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Abogado Responsable</label>
                        <select name="abogado_id" required class="w-full px-4 py-2 border rounded-md">
                            {% for abogado in abogados %}
                                <option value="{{ abogado.id }}">{{ abogado.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Medidas Cautelares Solicitadas</label>
                        <textarea name="medidas_cautelares" rows="2" placeholder="Ej: CUENTAS BANCARIAS | ESTABLECIMIENTO DE COMERCIO..." class="w-full px-4 py-2 border rounded-md uppercase"></textarea>
                    </div>
                </div>
            </div>

            <div class="flex justify-end pt-4">
                <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition-colors flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-5 h-5"></i> Radicar Proceso en el Sistema
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Inicializar los Buscadores Inteligentes
    new TomSelect("#select-demandantes",{ plugins: ['remove_button'], create: false, sortField: { field: "text", direction: "asc" }});
    new TomSelect("#select-demandados",{ plugins: ['remove_button'], create: false, sortField: { field: "text", direction: "asc" }});
    new TomSelect("#select-conjunto",{ create: false, sortField: { field: "text", direction: "asc" }});
    
    // Lógica para añadir filas dinámicas
    function agregarFila(tipo) {
        const contenedor = document.getElementById(`contenedor-nuevos-${tipo}`);
        const prefijo = tipo === 'demandantes' ? 'nuevo_dem' : 'nuevo_ddo';
        const html = `
            <div class="flex gap-2 items-center bg-white p-2 border rounded shadow-sm mt-2">
                <input type="text" name="${prefijo}_id" placeholder="Cédula/NIT" class="w-1/3 px-2 py-1.5 border rounded text-sm outline-none focus:border-teal-500" required>
                <input type="text" name="${prefijo}_nombre" placeholder="Nombre completo" class="w-2/3 px-2 py-1.5 border rounded text-sm uppercase outline-none focus:border-teal-500" required>
                <button type="button" onclick="this.parentElement.remove()" class="text-red-500 font-bold px-3 py-1 hover:bg-red-50 rounded">X</button>
            </div>`;
        contenedor.insertAdjacentHTML('beforeend', html);
    }
</script>
{% endblock %}
