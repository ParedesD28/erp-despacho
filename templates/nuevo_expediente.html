<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Expediente | ERP Jurídico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-4xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-900 mb-6 border-b pb-4 flex items-center gap-2">
            <i data-lucide="folder-plus" class="text-blue-600"></i> Radicación de Nuevo Expediente (Ficha Única)
        </h2>
        
        <form action="/crear_expediente_transaccional" method="POST" class="space-y-8">
            <!-- BLOQUE 1: DEUDOR -->
            <div class="bg-blue-50/50 p-5 rounded-lg border border-blue-100">
                <h3 class="font-semibold text-blue-800 mb-4 flex items-center gap-2"><i data-lucide="user" class="w-5 h-5"></i> 1. Datos del Deudor / Contraparte</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cédula / NIT</label>
                        <input type="text" name="cedula_deudor" required class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                        <input type="text" name="nombre_deudor" required class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
            </div>

            <!-- BLOQUE 2: INMUEBLE -->
            <div class="bg-green-50/50 p-5 rounded-lg border border-green-100">
                <h3 class="font-semibold text-green-800 mb-4 flex items-center gap-2"><i data-lucide="home" class="w-5 h-5"></i> 2. Propiedad Involucrada (PH)</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Conjunto Residencial</label>
                        <input type="text" name="conjunto" required class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Torre y Apto (Nomenclatura)</label>
                        <input type="text" name="apto" required placeholder="Ej: Torre 2 Apto 401" class="w-full px-4 py-2 border rounded-md focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                </div>
            </div>

            <!-- BLOQUE 3: PROCESO -->
            <div class="bg-purple-50/50 p-5 rounded-lg border border-purple-100">
                <h3 class="font-semibold text-purple-800 mb-4 flex items-center gap-2"><i data-lucide="scale" class="w-5 h-5"></i> 3. Datos Judiciales</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Naturaleza del Proceso</label>
                        <select name="naturaleza" class="w-full px-4 py-2 border rounded-md bg-white">
                            <option value="EJECUTIVO SINGULAR">Ejecutivo Singular</option>
                            <option value="EJECUTIVO HIPOTECARIO">Ejecutivo Hipotecario</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Radicado Rama Judicial</label>
                        <input type="text" name="radicado_rama" value="EN REPARTO" class="w-full px-4 py-2 border rounded-md outline-none">
                    </div>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-colors flex justify-center items-center gap-2">
                <i data-lucide="save"></i> Crear Expediente Completo
            </button>
        </form>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
