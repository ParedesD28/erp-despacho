<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - Despacho Digital</title>
    <!-- Mismas librerías de tu ERP -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-200 h-screen flex items-center justify-center font-sans relative overflow-hidden">

    <!-- Efecto visual de fondo (Opcional, le da un toque premium) -->
    <div class="absolute top-0 left-0 w-full h-96 bg-slate-900"></div>

    <!-- TARJETA CENTRAL DE LOGIN -->
    <div class="bg-white p-10 rounded-2xl shadow-2xl border border-slate-100 w-full max-w-md relative z-10">
        
        <!-- Logo / Icono Superior -->
        <div class="flex justify-center mb-6">
            <div class="bg-slate-900 p-4 rounded-xl text-white shadow-lg shadow-slate-400/50">
                <i data-lucide="scale" class="w-10 h-10"></i>
            </div>
        </div>
        
        <!-- Títulos -->
        <div class="text-center mb-8">
            <h2 class="text-2xl font-black text-slate-800 tracking-tight">Despacho Digital</h2>
            <p class="text-slate-500 text-sm mt-1">Acceso exclusivo para equipo jurídico</p>
        </div>

        <!-- Mensaje de Error (Se activa solo si se equivocan) -->
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm mb-6 flex items-center gap-3 font-medium animate-pulse">
            <i data-lucide="shield-alert" class="w-5 h-5"></i> 
            {{ error }}
        </div>
        {% endif %}

        <!-- Formulario -->
        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Correo Corporativo</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="mail" class="h-5 w-5 text-slate-400"></i>
                    </div>
                    <input type="email" name="email" required autocomplete="off"
                           class="w-full border border-slate-300 rounded-lg pl-10 p-3 text-sm bg-slate-50 focus:bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none text-slate-800 transition-all" 
                           placeholder="abogado@firma.com">
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="h-5 w-5 text-slate-400"></i>
                    </div>
                    <input type="password" name="password" required 
                           class="w-full border border-slate-300 rounded-lg pl-10 p-3 text-sm bg-slate-50 focus:bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none text-slate-800 transition-all" 
                           placeholder="••••••••">
                </div>
            </div>
            
            <!-- Botón -->
            <button type="submit" class="w-full bg-slate-900 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg transition-all shadow-md hover:shadow-lg mt-4 flex items-center justify-center gap-2">
                Ingresar al Sistema <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-100 pt-6">
            <p class="text-[10px] text-slate-400 uppercase tracking-widest">© 2026 LegalTech ERP</p>
        </div>
    </div>

    <!-- Inicializador de Iconos -->
    <script>lucide.createIcons();</script>
</body>
</html>
