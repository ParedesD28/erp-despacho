<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - Despacho Digital</title>
    
    <!-- ESTA LÍNEA ES LA PINTURA (TAILWIND CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ESTA LÍNEA SON LOS ÍCONOS (LUCIDE) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 h-screen flex items-center justify-center font-sans">
    
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- Header decorativo Institucional -->
        <div class="bg-slate-800 px-8 py-8 text-center border-b-4 border-teal-500">
            <div class="bg-slate-700 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                <i data-lucide="scale" class="w-8 h-8 text-teal-400"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">Despacho Digital</h1>
            <p class="text-slate-400 text-sm mt-2">Acceso exclusivo para equipo jurídico</p>
        </div>

        <!-- Formulario -->
        <div class="p-8">
            <form action="/login" method="POST" class="space-y-6">
                
                <!-- Mensaje de error (Se mostrará solo si el backend envía un error) -->
                {% if error %}
                <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm flex items-center gap-2 border border-red-200">
                    <i data-lucide="alert-circle" class="w-5 h-5"></i> 
                    <span class="font-semibold">{{ error }}</span>
                </div>
                {% endif %}

                <!-- Campo de Correo -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2">
                        <i data-lucide="mail" class="w-4 h-4 text-slate-400"></i> Correo Corporativo
                    </label>
                    <input type="email" name="email" required placeholder="abogado@firma.com" 
                           class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none transition-all text-slate-700">
                </div>

                <!-- Campo de Contraseña -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-400"></i> Contraseña
                    </label>
                    <input type="password" name="password" required placeholder="••••••••" 
                           class="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none transition-all text-slate-700">
                </div>

                <!-- Botón de Ingreso -->
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3.5 px-4 rounded-lg shadow-lg hover:shadow-xl transition-all flex justify-center items-center gap-2 mt-2">
                    Ingresar al Sistema <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </form>
        </div>
        
        <!-- Footer -->
        <div class="bg-slate-50 py-4 text-center text-xs text-slate-500 border-t border-slate-100">
            &copy; 2026 LegalTech ERP. Todos los derechos reservados.
        </div>
    </div>

    <!-- Script para renderizar los íconos -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
