name: ERP syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run regression tests
        env:
          # Valor ficticio: security.py exige el secreto en import time y los tests
          # importan main/agenda_service. El secreto real vive en Render.
          ERP_SESSION_SECRET: ci-dummy-secret-not-used-in-production-000000
        run: python -m unittest discover -s tests -p "test_*.py" -v
