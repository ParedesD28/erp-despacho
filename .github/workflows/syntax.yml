name: ERP syntax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Migrations apply on an empty DB and are idempotent
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
        run: |
          python migrate.py apply
          python migrate.py apply
          python migrate.py check
      - name: Run regression tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_test
          # Valor ficticio: security.py exige el secreto en import time y los tests
          # importan main/agenda_service. El secreto real vive en Render.
          ERP_SESSION_SECRET: ci-dummy-secret-not-used-in-production-000000
        run: python -m unittest discover -s tests -p "test_*.py" -v
