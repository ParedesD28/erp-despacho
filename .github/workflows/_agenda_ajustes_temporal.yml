def _sumar_meses_agenda(fecha, meses):
    import calendar
    base = fecha.month - 1 + meses
    anio = fecha.year + base // 12
    mes = base % 12 + 1
    dia = min(fecha.day, calendar.monthrange(anio, mes)[1])
    return date(anio, mes, dia)


