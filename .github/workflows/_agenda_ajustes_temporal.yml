@app.post("/acuerdos/guardar")
def guardar_acuerdo_manual(
    request: Request,
    identificacion_deudor: str = Form(...),
    fecha_compromiso: str = Form(...),
    valor_acordado: float = Form(0.0),
    nombre_deudor: str = Form(""),
    telefono: str = Form(""),
    inmueble_id: int | None = Form(None),
    observaciones: str = Form(""),
    numero_cuotas: int = Form(1),
    frecuencia: str = Form("MENSUAL"),
    radicado_interno: str | None = Form(None),
):
    _ensure_crm_and_vencimientos_schema()
    conn = db.get_connection()
    try:
        with conn:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
                ident = str(identificacion_deudor or "").strip()
                cur.execute("""
                    SELECT identificacion, nombre, telefono FROM contactos
                    WHERE identificacion=%s OR REGEXP_REPLACE(COALESCE(identificacion::text,''),'[^0-9]','','g')=%s
                    ORDER BY id ASC LIMIT 1
                """, (ident, re.sub(r"\D", "", ident)))
                persona = cur.fetchone()
                if not persona:
                    raise ValueError("La persona no existe en Contactos. Seleccione una persona válida por nombre o cédula.")

                ident = str(persona["identificacion"])
                nombre_real = str(persona.get("nombre") or nombre_deudor or ident)
                telefono_real = str(persona.get("telefono") or telefono or "")
                if not inmueble_id:
                    cur.execute("""
                        SELECT i.id
                        FROM inmuebles_ph i
                        JOIN contactos c ON c.id=i.contacto_id
                        WHERE c.identificacion=%s
                        ORDER BY i.id DESC LIMIT 1
                    """, (ident,))
                    row_inm = cur.fetchone()
                    if row_inm:
                        inmueble_id = int(row_inm["id"])

                n = max(1, min(int(numero_cuotas or 1), 120))
                frecuencia = str(frecuencia or "MENSUAL").upper()
                if frecuencia not in {"MENSUAL", "QUINCENAL", "SEMANAL"}:
                    frecuencia = "MENSUAL"
                total = round(float(valor_acordado or 0), 2)
                primera = date.fromisoformat(str(fecha_compromiso))

                cur.execute("""
                    INSERT INTO acuerdos_pago (
                        inmueble_id, identificacion_deudor, nombre_deudor, telefono,
                        valor_acordado, numero_cuotas, cuota_actual, fecha_compromiso,
                        estado, origen, observaciones, abogado_id, frecuencia
                    ) VALUES (%s,%s,%s,%s,%s,%s,1,%s,'PENDIENTE','ABOGADO_HUMANO',%s,%s,%s)
                    RETURNING id
                """, (inmueble_id, ident, nombre_real, telefono_real, total, n, primera,
                      observaciones.strip(), str(getattr(request.state, "user_id", "") or "") or None, frecuencia))
                acuerdo_id = int(cur.fetchone()["id"])

                base_cuota = round(total / n, 2) if n else total
                acumulado = 0.0
                for numero in range(1, n + 1):
                    if numero < n:
                        valor_cuota = base_cuota
                        acumulado += valor_cuota
                    else:
                        valor_cuota = round(total - acumulado, 2)
                    if frecuencia == "SEMANAL":
                        fecha_cuota = primera + timedelta(days=7 * (numero - 1))
                    elif frecuencia == "QUINCENAL":
                        fecha_cuota = primera + timedelta(days=15 * (numero - 1))
                    else:
                        fecha_cuota = _sumar_meses_agenda(primera, numero - 1)
                    cur.execute("""
                        INSERT INTO acuerdos_pago_cuotas
                            (acuerdo_id, numero_cuota, fecha_vencimiento, valor_cuota, abogado_id)
                        VALUES (%s,%s,%s,%s,%s)
                    """, (acuerdo_id, numero, fecha_cuota, valor_cuota,
                          str(getattr(request.state, "user_id", "") or "") or None))

                cur.execute("""
                    INSERT INTO gestiones_crm
                        (inmueble_id, identificacion_deudor, tipo_contacto,
                         resumen, promesa_pago_fecha, usuario, estado)
                    VALUES (%s,%s,'Acuerdo Manual',%s,%s,'Abogado ERP','ACTIVO')
                """, (inmueble_id, ident,
                      f"[ACUERDO DE PAGO #{acuerdo_id}] {n} cuota(s) {frecuencia} por ${total:,.0f}.",
                      primera))

                nombre_abogado = _registrar_agenda_auditoria(
                    cur, request, "CREAR_ACUERDO", "ACUERDO_PAGO", acuerdo_id,
                    radicado_interno, ident, nombre_real, inmueble_id,
                    f"Valor ${total:,.2f}; {n} cuota(s); frecuencia {frecuencia}; primera cuota {primera}"
                )
        return _redirect("/vencimientos", mensaje="Acuerdo+registrado+exitosamente")
    except Exception as exc:
        print(f"[ACUERDO] Error guardando acuerdo: {exc!r}", flush=True)
        return _redirect("/vencimientos", error="No+fue+posible+registrar+el+acuerdo")
    finally:
        conn.release()


@app.post("/acuerdos/cumplir")
def cumplir_acuerdo(request: Request, acuerdo_id: int = Form(...), cuota_id: int | None = Form(None)):
    _ensure_crm_and_vencimientos_schema()
    conn = db.get_connection()
    try:
        with conn:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
                if cuota_id:
                    cur.execute("UPDATE acuerdos_pago_cuotas SET estado='CUMPLIDO', updated_at=CURRENT_TIMESTAMP WHERE id=%s AND acuerdo_id=%s", (cuota_id, acuerdo_id))
                    cur.execute("SELECT numero_cuota, identificacion_deudor, nombre_deudor, inmueble_id FROM acuerdos_pago_cuotas c JOIN acuerdos_pago a ON a.id=c.acuerdo_id WHERE c.id=%s", (cuota_id,))
                    cuota = cur.fetchone()
                    cur.execute("""
                        SELECT COUNT(*) AS total,
                               COUNT(*) FILTER (WHERE estado='CUMPLIDO' AND NOT COALESCE(anulado,FALSE)) AS cumplidas
                        FROM acuerdos_pago_cuotas WHERE acuerdo_id=%s
                    """, (acuerdo_id,))
                    estado = cur.fetchone()
                    if estado and int(estado["total"] or 0) > 0 and int(estado["total"]) == int(estado["cumplidas"]):
                        cur.execute("UPDATE acuerdos_pago SET estado='CUMPLIDO', cuota_actual=numero_cuotas, updated_at=CURRENT_TIMESTAMP WHERE id=%s", (acuerdo_id,))
                    else:
                        cur.execute("UPDATE acuerdos_pago SET cuota_actual=LEAST(numero_cuotas, COALESCE((SELECT MAX(numero_cuota) FROM acuerdos_pago_cuotas WHERE acuerdo_id=%s AND estado='CUMPLIDO'),1)+1), updated_at=CURRENT_TIMESTAMP WHERE id=%s", (acuerdo_id, acuerdo_id))
                    if cuota:
                        _registrar_agenda_auditoria(cur, request, "CUMPLIR_CUOTA", "ACUERDO_PAGO", cuota_id, None, cuota["identificacion_deudor"], cuota["nombre_deudor"], cuota["inmueble_id"], f"Cuota {cuota['numero_cuota']} cumplida")
                else:
                    cur.execute("UPDATE acuerdos_pago SET estado='CUMPLIDO', cuota_actual=numero_cuotas, updated_at=CURRENT_TIMESTAMP WHERE id=%s", (acuerdo_id,))
                    cur.execute("UPDATE acuerdos_pago_cuotas SET estado='CUMPLIDO', updated_at=CURRENT_TIMESTAMP WHERE acuerdo_id=%s AND COALESCE(anulado,FALSE)=FALSE", (acuerdo_id,))
                    _registrar_agenda_auditoria(cur, request, "CUMPLIR_ACUERDO", "ACUERDO_PAGO", acuerdo_id, None, None, None, None, "Acuerdo completo marcado como cumplido")
        return _redirect("/vencimientos", mensaje="Pago+registrado")
    except Exception as exc:
        print(f"[ACUERDO] Error cumpliendo: {exc!r}", flush=True)
        return _redirect("/vencimientos", error="No+fue+posible+registrar+el+pago")
    finally:
        conn.release()


