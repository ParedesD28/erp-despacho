@app.post("/acuerdos/anular")
def anular_acuerdo(request: Request, acuerdo_id: int = Form(...)):
    _ensure_crm_and_vencimientos_schema()
    conn = db.get_connection()
    try:
        with conn:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
                cur.execute("SELECT identificacion_deudor,nombre_deudor,inmueble_id FROM acuerdos_pago WHERE id=%s", (acuerdo_id,))
                a = cur.fetchone()
                if not a:
                    raise ValueError("Acuerdo no encontrado")
                cur.execute("UPDATE acuerdos_pago SET estado='ANULADO', updated_at=CURRENT_TIMESTAMP WHERE id=%s", (acuerdo_id,))
                cur.execute("UPDATE acuerdos_pago_cuotas SET estado='ANULADO', anulado=TRUE, updated_at=CURRENT_TIMESTAMP WHERE acuerdo_id=%s", (acuerdo_id,))
                cur.execute("UPDATE vencimientos SET anulado=TRUE WHERE tipo='ACUERDO_PAGO' AND observaciones ILIKE %s", (f"%Acuerdo #{acuerdo_id}%",))
                _registrar_agenda_auditoria(cur, request, "ANULAR_ACUERDO", "ACUERDO_PAGO", acuerdo_id, None, a["identificacion_deudor"], a["nombre_deudor"], a["inmueble_id"], "Acuerdo y cuotas anulados")
        return _redirect("/vencimientos", mensaje="Acuerdo+anulado")
    except Exception as exc:
        print(f"[ACUERDO] Error anulando: {exc!r}", flush=True)
        return _redirect("/vencimientos", error="No+fue+posible+anular+el+acuerdo")
    finally:
        conn.release()


@app.post("/vencimientos/guardar")
def guardar_vencimiento(
    request: Request,
    radicado_interno: str = Form(...),
    titulo: str = Form(...),
    fecha_vencimiento: date = Form(...),
    observaciones: str = Form(""),
    categoria: str = Form("TERMINO"),
    inmueble_id: int | None = Form(None),
):
    _ensure_crm_and_vencimientos_schema()
    conn = db.get_connection()
    try:
        with conn:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
                categoria = str(categoria or "TERMINO").upper()
                if categoria not in {"TERMINO", "OTROS"}:
                    categoria = "TERMINO"
                cur.execute("""
                    INSERT INTO vencimientos
                        (radicado_interno,titulo,fecha_vencimiento,observaciones,completado,tipo,valor,inmueble_id,anulado,categoria,abogado_id)
                    VALUES (%s,%s,%s,%s,FALSE,%s,0,%s,FALSE,%s,%s)
                    RETURNING id
                """, (radicado_interno.strip(), titulo.strip(), fecha_vencimiento, observaciones.strip(), categoria, inmueble_id, categoria, str(getattr(request.state, "user_id", "") or "") or None))
                registro_id = int(cur.fetchone()["id"])
                _registrar_agenda_auditoria(cur, request, "CREAR_VENCIMIENTO", categoria, registro_id, radicado_interno, None, None, inmueble_id, titulo.strip())
        return _redirect("/vencimientos", mensaje="Vencimiento+registrado")
    except Exception as exc:
        print(f"[VENCIMIENTO] Error guardando: {exc!r}", flush=True)
        return _redirect("/vencimientos", error="No+fue+posible+registrar+el+vencimiento")
    finally:
        conn.release()


@app.post("/vencimientos/completar")
def completar_vencimiento(request: Request, vencimiento_id: int = Form(...)):
    _ensure_crm_and_vencimientos_schema()
    conn = db.get_connection()
    try:
        with conn:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
                cur.execute("SELECT radicado_interno,titulo,inmueble_id FROM vencimientos WHERE id=%s", (vencimiento_id,))
                v = cur.fetchone()
                if not v:
                    raise ValueError("Vencimiento no encontrado")
                cur.execute("UPDATE vencimientos SET completado=TRUE WHERE id=%s", (vencimiento_id,))
                _registrar_agenda_auditoria(cur, request, "COMPLETAR_VENCIMIENTO", "VENCIMIENTO", vencimiento_id, v["radicado_interno"], None, None, v["inmueble_id"], v["titulo"])
        return _redirect("/vencimientos", mensaje="Vencimiento+completado")
    finally:
        conn.release()


@app.post("/vencimientos/anular")
def anular_vencimiento(request: Request, vencimiento_id: int = Form(...)):
    _ensure_crm_and_vencimientos_schema()
    conn = db.get_connection()
    try:
        with conn:
            with conn.cursor(cursor_factory=RealDictCursor) as cur:
                cur.execute("SELECT radicado_interno,titulo,inmueble_id,categoria FROM vencimientos WHERE id=%s", (vencimiento_id,))
                v = cur.fetchone()
                if not v:
                    raise ValueError("Vencimiento no encontrado")
                cur.execute("UPDATE vencimientos SET anulado=TRUE WHERE id=%s", (vencimiento_id,))
                _registrar_agenda_auditoria(cur, request, "ANULAR_VENCIMIENTO", str(v["categoria"] or "TERMINO"), vencimiento_id, v["radicado_interno"], None, None, v["inmueble_id"], v["titulo"])
        return _redirect("/vencimientos", mensaje="Vencimiento+anulado")
    except Exception as exc:
        print(f"[VENCIMIENTO] Error anulando: {exc!r}", flush=True)
        return _redirect("/vencimientos", error="No+fue+posible+anular+el+vencimiento")
    finally:
        conn.release()


@app.get("/__interno/agenda-log.xlsx", include_in_schema=False)
def exportar_agenda_log(request: Request):
    """Libro interno no enlazado desde el ERP; requiere sesión autenticada."""
    if not getattr(request.state, "user_id", None):
        raise HTTPException(status_code=401, detail="No autorizado")
    conn = db.get_connection()
    try:
        with conn.cursor(cursor_factory=RealDictCursor) as cur:
            cur.execute("""
                SELECT fecha, abogado_id, abogado_nombre, accion, tipo, registro_id,
                       radicado_interno, identificacion_deudor, nombre_deudor,
                       inmueble_id, detalle
                FROM agenda_auditoria
                ORDER BY fecha DESC, id DESC
            """)
            rows = [dict(r) for r in cur.fetchall()]
        wb = openpyxl.Workbook()
        ws = wb.active
        ws.title = "Auditoria Agenda"
        headers = ["Fecha", "Abogado ID", "Abogado", "Acción", "Tipo", "Registro ID", "Radicado", "Identificación", "Deudor", "Inmueble ID", "Detalle"]
        ws.append(headers)
        for row in rows:
            ws.append([row.get(k) for k in ["fecha","abogado_id","abogado_nombre","accion","tipo","registro_id","radicado_interno","identificacion_deudor","nombre_deudor","inmueble_id","detalle"]])
        for cell in ws[1]:
            cell.font = Font(bold=True)
        ws.freeze_panes = "A2"
        ws.auto_filter.ref = ws.dimensions
        for column_cells in ws.columns:
            width = min(max(len(str(c.value or "")) for c in column_cells) + 2, 45)
            ws.column_dimensions[column_cells[0].column_letter].width = width
        output = io.BytesIO()
        wb.save(output)
        output.seek(0)
        _json_log("INFO", "agenda_audit_export", user_id=str(getattr(request.state, "user_id", "")))
        return StreamingResponse(output, media_type="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", headers={"Content-Disposition":"attachment; filename=agenda_auditoria_interna.xlsx", "Cache-Control":"no-store"})
    finally:
        conn.release()


