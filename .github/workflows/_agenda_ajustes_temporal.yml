function seleccionarContacto(valor){const raw=String(valor||'').split(' - ')[0].trim();const m=contactos.find(c=>String(c.identificacion||'')===raw)||contactos.find(c=>String(c.nombre||'').toLowerCase()===String(valor||'').toLowerCase());if(!m){document.getElementById('a-confirm').textContent='';document.getElementById('a-ident').value='';return}document.getElementById('a-ident').value=m.identificacion||'';document.getElementById('a-nombre').value=m.nombre||'';document.getElementById('a-tel').value=m.telefono||'';document.getElementById('a-confirm').textContent=`Persona vinculada: ${m.nombre||''} · ${m.identificacion||''}`}
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderizarCalendario(){const grid=document.getElementById('cal-grid'),title=document.getElementById('cal-mes-ano'),y=fechaActual.getFullYear(),m=fechaActual.getMonth();title.textContent=`${meses[m]} ${y}`;grid.innerHTML='';const start=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),hoy=fmt(new Date());for(let i=start-1;i>=0;i--)grid.innerHTML+=`<div class="p-1.5 text-[10px] text-slate-300 rounded-lg bg-slate-50 min-h-[58px]">${prev-i}</div>`;for(let d=1;d<=days;d++){const f=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,sel=f===diaSeleccionado,ev=eventos.filter(e=>e.fecha===f),a=ev.filter(e=>e.tipo==='ACUERDO_PAGO'),v=ev.filter(e=>e.tipo==='TERMINO_JUDICIAL'),o=ev.filter(e=>e.tipo==='OTRO');let badges='';if(a.length)badges+=`<span class="block px-1 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[9px] font-bold truncate">🤝 ${a.length} cuota(s)</span>`;if(v.length)badges+=`<span class="block px-1 py-0.5 rounded bg-blue-100 text-blue-800 text-[9px] font-bold truncate">⚖️ ${v.length} venc.</span>`;if(o.length)badges+=`<span class="block px-1 py-0.5 rounded bg-indigo-100 text-indigo-800 text-[9px] font-bold truncate">＋ ${o.length} otros</span>`;grid.innerHTML+=`<div onclick="seleccionarDia('${f}')" class="p-1.5 rounded-xl border ${sel?'border-emerald-500 ring-2 ring-emerald-200':'border-slate-100 hover:border-slate-300'} min-h-[58px] cursor-pointer"><div class="text-xs font-semibold text-slate-700">${d}</div><div class="space-y-0.5 mt-1">${badges}</div></div>`}const rest=(start+days)%7?7-((start+days)%7):0;for(let d=1;d<=rest;d++)grid.innerHTML+=`<div class="p-1.5 text-[10px] text-slate-300 rounded-lg bg-slate-50 min-h-[58px]">${d}</div>`}
function seleccionarDia(f){diaSeleccionado=f;renderizarCalendario();renderEventos(eventos.filter(e=>e.fecha===f))}
function irHoy(){fechaActual=new Date();diaSeleccionado=fmt(fechaActual);renderizarCalendario();renderEventos(eventos.filter(e=>e.fecha===diaSeleccionado))}
function cambiarMes(delta){fechaActual.setMonth(fechaActual.getMonth()+delta);renderizarCalendario()}
function renderEventos(lista){const box=document.getElementById('panel-eventos-lista');document.getElementById('panel-fecha-titulo').textContent=lista.length?'Eventos seleccionados':'Sin eventos';document.getElementById('panel-fecha-sub').textContent=lista.length+` registro(s)`;box.innerHTML=lista.length?lista.map(e=>{if(e.tipo==='ACUERDO_PAGO'){return `<div class="p-3 rounded-xl border border-emerald-200 bg-emerald-50/40 text-xs"><div class="flex justify-between gap-2"><div><b>🤝 ${escapeHtml(e.titulo)}</b><div class="text-[11px] text-slate-500">${escapeHtml(e.inmueble||'')} · $${Number(e.valor||0).toLocaleString('es-CO')}</div></div><form method="POST" action="/acuerdos/anular" onsubmit="return confirm('¿Anular este acuerdo?');"><input type="hidden" name="acuerdo_id" value="${e.acuerdo_id}"><button class="px-2 py-1 rounded bg-red-600 text-white font-bold text-[10px]">Anular</button></form></div><div class="mt-2 flex justify-between"><span>Fecha: <b>${e.fecha}</b></span>${e.estado==='CUMPLIDO'?'✅ Cumplida':`<form method="POST" action="/acuerdos/cumplir"><input type="hidden" name="acuerdo_id" value="${e.acuerdo_id}"><input type="hidden" name="cuota_id" value="${e.cuota_id}"><button class="px-2 py-1 rounded bg-emerald-600 text-white font-bold text-[10px]">Pagada</button></form>`}</div></div>`}if(e.tipo==='OTRO'){return `<div class="p-3 rounded-xl border border-indigo-200 bg-indigo-50/40 text-xs"><div class="flex justify-between gap-2"><div><b>＋ ${escapeHtml(e.titulo)}</b><div class="text-[11px] text-slate-500">${e.fecha}</div></div><form method="POST" action="/vencimientos/anular"><input type="hidden" name="vencimiento_id" value="${e.id.split('-')[1]}"><button class="px-2 py-1 rounded bg-red-600 text-white font-bold text-[10px]">Anular</button></form></div>${e.observaciones?`<div class="mt-2 text-[11px] text-slate-600">${escapeHtml(e.observaciones)}</div>`:''}</div>`}return `<div class="p-3 rounded-xl border border-blue-200 bg-blue-50/40 text-xs"><div class="flex justify-between gap-2"><div><b>⚖️ ${escapeHtml(e.titulo)}</b><div class="text-[11px] text-slate-500">${escapeHtml(e.radicado||'')}</div></div><form method="POST" action="/vencimientos/anular"><input type="hidden" name="vencimiento_id" value="${e.id.split('-')[1]}"><button class="px-2 py-1 rounded bg-red-600 text-white font-bold text-[10px]">Anular</button></form></div><div class="mt-2">Límite: <b>${e.fecha}</b></div></div>`}).join(''):'<div class="p-8 text-center text-slate-400 text-xs">No hay eventos.</div>'}
function escapeHtml(str){return String(str||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.addEventListener('DOMContentLoaded',()=>{irHoy()});
</script>
{% endblock %}'''
